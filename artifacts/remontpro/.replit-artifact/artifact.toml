kind = "web"
previewPath = "/"
title = "РемонтPRO — AI-тренер"
version = "1.0.0"
id = "artifacts/remontpro"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20349

[services.development]
run = "pnpm --filter @workspace/remontpro run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/remontpro", "run", "build" ]
publicDir = "artifacts/remontpro/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20349"
BASE_PATH = "/"
